@if (run) {
  <div class="run-progress-container p-4">

    <div class="mb-4">
      <h2 class="text-2xl font-semibold text-color m-0 mb-2">{{ run.name }}</h2>
      <plc-run-status-badge [runStatus]="run.status"></plc-run-status-badge>
    </div>

    @if (nodes.length > 0) {
      <p-card>
        <div class="nodes-list">
          @for (node of nodes; track node.description) {
            <div class="node-item">
              <span class="node-label">{{ node.description }}</span>
              <div class="node-progress-wrapper">
                <p-progressBar
                  [value]="getPercentage(node) || 0"
                  [showValue]="false"
                  styleClass="run-progress-bar"
                ></p-progressBar>
              </div>
              <span class="node-counter">
                {{ node.current }}{{ node.total ? ' / ' + node.total : '' }}
              </span>
            </div>
          }
        </div>
      </p-card>
    } @else {
      <p-card>
        <div class="flex align-items-center justify-content-center gap-2 py-4">
          <i class="pi pi-spin pi-spinner text-2xl text-primary"></i>
          <span class="text-color-secondary">In attesa dei dati di progresso...</span>
        </div>
      </p-card>
    }

    <div class="flex justify-content-center mt-4">
      <p-button
        label="Vai all'analisi"
        icon="pi pi-chart-bar"
        severity="info"
        [disabled]="!isCompleted"
        (click)="onGoToAnalysis()"
      ></p-button>
    </div>

  </div>
} @else {
  <div class="flex align-items-center justify-content-center min-h-screen">
    <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
  </div>
}
