<p-dialog 
  [(visible)]="visible" 
  [header]="header" 
  [modal]="true" 
  [style]="{ width: '50vw', 'min-height': '40vh' }"
  [draggable]="false" 
  [resizable]="false"
  (onHide)="close()">

  
  <!-- BREADCRUMBS -->
  <div class="breadcrumb-container" *ngIf="breadcrumbs.length > 0">
    <p-breadcrumb 
      [model]="breadcrumbs" 
      [home]="{icon: 'pi pi-home'}"
      (onItemClick)="onBreadcrumbClick($event.item)">
    </p-breadcrumb>
  </div>
  
  <ng-content></ng-content>
  
  <ng-template pTemplate="footer">
    
    <p-button 
        label="Annulla" 
        severity="secondary" 
        (onClick)="close()"
        [style]="{ 
        'min-width': '140px', 
        'height': '45px',
        'font-size': '1.1rem'
        }"> 
    </p-button>

    <p-button label="Conferma" 
    (onClick)="confirm()" 
    [style]="{ 
        'min-width': '140px', 
        'height': '45px',
        'font-size': '1.1rem'
      }">
    </p-button>

  </ng-template>
</p-dialog>
